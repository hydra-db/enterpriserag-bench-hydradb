# Copy to config/my-run.yaml and edit. Everything under `generation` and
# `retrieval` matches the published run; change only what you mean to change.
# A different hydradb.database/collection is a different corpus: results are not
# comparable to the published run until you have ingested the corpus there
# (REPRODUCE.md level 4).
name: my-run

hydradb:
  base_url: https://api.hydradb.com
  database: my-erb-database        # a database you own
  collection: entire               # a fresh collection for the ingest

retrieval:
  mode: thinking
  alpha: 0.5
  max_results: 100
  query_by: hybrid
  query_apps: false

generation:
  model: openai/gpt-5.4            # provider openai -> "gpt-5.4"
  provider: openrouter
  max_tokens: 4000
  temperature: 0.0
  docs_in_context: 12
  submit_docs: 10
  max_context_chars: 240000
  correction_loop: true
  prompts_version: two-pass-v1
  hydration: canonical-v2
  workers: 6

judge:
  model: openai/gpt-5.4            # provider openai -> "gpt-5.4"
  provider: openrouter
  cheap_model: openai/gpt-5-mini   # provider openai -> "gpt-5-mini"
  strict_parallelism: 6
  shards: 20
  shard_parallelism: 5
