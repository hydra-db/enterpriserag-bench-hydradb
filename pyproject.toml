[project]
name = "erb-hydradb"
version = "1.0.0"
description = "Reproducible harness for HydraDB on EnterpriseRAG-Bench: ingest, retrieve, generate, judge, compare."
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.13"
authors = [{ name = "HydraDB" }]
dependencies = [
  "httpx==0.28.1",
  "python-dotenv==1.2.3",
  "openai==3.8.0",
  "pyyaml==6.0.3",
  # Required by the upstream evaluator (onyx-dot-app/EnterpriseRAG-Bench), which
  # this harness invokes as a subprocess with the same interpreter.
  "pydantic==2.13.5",
  "tiktoken==0.14.0",
  "anthropic==1.3.0",
]

[project.optional-dependencies]
# Only needed to build documents.sqlite from the Hugging Face dataset
# (reproduction level 4). Not needed to re-judge or regenerate.
corpus = ["datasets>=2.20,<4", "pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
erb-hydradb = "erb_hydradb.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erb_hydradb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E701", "E702", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/erb_hydradb/prompts.py" = ["E501"]        # prompts are verbatim; line length is part of the artifact
"src/erb_hydradb/erb_patches/*" = ["E501", "F841"] # drop-in replacements for upstream evaluator files
"src/erb_hydradb/analysis.py" = ["E501"]
"src/erb_hydradb/cli.py" = ["E501"]
"src/erb_hydradb/judge.py" = ["E501"]
"src/erb_hydradb/generate.py" = ["E501"]
"src/erb_hydradb/validate.py" = ["E501"]
"src/erb_hydradb/corpus.py" = ["E501"]
"src/erb_hydradb/ingest.py" = ["E501"]
"tests/*" = ["E501"]
